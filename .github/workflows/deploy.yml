name: Build and Deploy FoodLife

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prepare deploy package
        run: |
          mkdir deploy
          cp -R dist/. deploy/
          cp app.css deploy/
          cp auth-status.php deploy/
          cp footer.php deploy/
          cp forgot-password.php deploy/
          cp header.php deploy/
          cp login.php deploy/
          cp logout.php deploy/
          cp register.php deploy/
          cp resend-verification.php deploy/
          cp reset-password.php deploy/
          cp verify-email.php deploy/

      - name: Deploy app files to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy/
          server-dir: /www/subdom/foodlife/
