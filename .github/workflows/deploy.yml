name: Build and Deploy FoodLife

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prepare deploy package
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir deploy
          cp -R dist/. deploy/
          cp api-helpers.php deploy/
          cp app.css deploy/
          cp auth-status.php deploy/
          cp day-health.php deploy/
          cp day-journal.php deploy/
          cp exercises-search.php deploy/
          cp food-delete.php deploy/
          cp food-save.php deploy/
          cp foods-search.php deploy/
          cp footer.php deploy/
          cp forgot-password.php deploy/
          cp header.php deploy/
          cp login.php deploy/
          cp logout.php deploy/
          cp meal-delete.php deploy/
          cp meal-save.php deploy/
          cp meals-day.php deploy/
          cp recipe-delete.php deploy/
          cp recipe-helpers.php deploy/
          cp recipe-save.php deploy/
          cp recipes-list.php deploy/
          cp register.php deploy/
          cp resend-verification.php deploy/
          cp reset-password.php deploy/
          cp user-foods.php deploy/
          cp user-profile.php deploy/
          cp verify-email.php deploy/
          cp weight-logs.php deploy/
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Missing DB_PASSWORD secret"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs')
          const dbPassword = JSON.stringify(process.env.DB_PASSWORD || '')
          fs.writeFileSync('deploy/config.php', `<?php
          // FoodLife database connection and shared helpers.

          $DB_HOST = 'md422.wedos.net';
          $DB_NAME = 'd374970_food';
          $DB_USER = 'a374970_food';
          $DB_PASS = ${dbPassword};

          try {
              $pdo = new PDO(
                  "mysql:host=$DB_HOST;dbname=$DB_NAME;charset=utf8mb4",
                  $DB_USER,
                  $DB_PASS,
                  [
                      PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                  ]
              );
          } catch (PDOException $e) {
              http_response_code(500);
              die('Chyba pripojeni k databazi.');
          }

          if (session_status() === PHP_SESSION_NONE) {
              session_start();
          }

          if (!function_exists('log_error')) {
              function log_error(string $msg): void
              {
                  $dir = __DIR__ . DIRECTORY_SEPARATOR . 'logs';
                  if (!is_dir($dir)) {
                      @mkdir($dir, 0755, true);
                  }

                  $file = $dir . DIRECTORY_SEPARATOR . 'app-errors.log';
                  $entry = '[' . date('Y-m-d H:i:s') . '] ' . $msg . PHP_EOL;
                  @file_put_contents($file, $entry, FILE_APPEND | LOCK_EX);
              }
          }

          if (!function_exists('app_base_url')) {
              function app_base_url(): string
              {
                  $https = !empty($_SERVER['HTTPS']) && $_SERVER['HTTPS'] !== 'off';
                  $scheme = $https ? 'https' : 'http';
                  $host = $_SERVER['HTTP_HOST'] ?? 'localhost';
                  $dir = rtrim(str_replace('\\\\', '/', dirname($_SERVER['SCRIPT_NAME'] ?? '')), '/');

                  return $scheme . '://' . $host . ($dir === '' ? '' : $dir);
              }
          }
          `)
          NODE

      - name: Deploy app files to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./deploy/
          server-dir: /www/subdom/foodlife/

      - name: Normalize deployed permissions
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: /www/subdom/foodlife
        run: |
          python3 - <<'PY'
          import os
          import ssl
          import sys
          from pathlib import Path
          from posixpath import join as remote_join
          from ftplib import FTP_TLS, error_perm

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          server_dir = os.environ['FTP_SERVER_DIR'].rstrip('/')
          local_dir = Path('deploy')

          ftp = FTP_TLS(context=ssl._create_unverified_context())

          def chmod(mode, path):
              try:
                  ftp.sendcmd(f'SITE CHMOD {mode} {path}')
              except error_perm as exc:
                  print(f'::warning::Could not chmod {mode} {path}: {exc}')

          def remote_path(local_path):
              relative = local_path.relative_to(local_dir).as_posix()
              return server_dir if relative == '.' else remote_join(server_dir, relative)

          def normalize_uploaded_permissions():
              chmod('775', server_dir)

              for root, dirs, files in os.walk(local_dir):
                  root_path = Path(root)
                  chmod('775', remote_path(root_path))

                  for dirname in dirs:
                      chmod('775', remote_path(root_path / dirname))

                  for filename in files:
                      chmod('664', remote_path(root_path / filename))

          try:
              ftp.connect(server, 21, timeout=60)
              ftp.login(username, password)
              ftp.prot_p()
              normalize_uploaded_permissions()
          except Exception as exc:
              print(f'::warning::Permission normalization skipped: {exc}')
              sys.exit(0)
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          PY
